name: Sync to Hugging Face

on:
  push:
    branches: [main]

  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face
        uses: nateraw/huggingface-sync-action@v0.0.5
        with:
          github_repo_id: 'KushAsrani/LangGraph-RAG-Technical-Docs-Assistant'
          huggingface_repo_id: 'KushAsrani/LangGraph-RAG-Technical-Docs-Assistant'
          hf_token: ${{ secrets.HF_TOKEN }}
          repo_type: 'space'